<!-- @dsCard height=300 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap">
<style>
  body { margin: 0; padding: 0; background: var(--bg); }
  .cover { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--bg); }
  .cover svg { position: absolute; inset: 0; width: 960px; height: 300px; }
  .c-chip { fill: var(--chip); }
  .c-lime { fill: var(--lime); }
  .c-lav { fill: var(--lavender); }
  .c-vio { fill: var(--violet); }
  .c-lil { fill: var(--lilac); }
  .r-card { rx: var(--radius-card); }
  .text { position: absolute; left: 40px; bottom: 36px; width: 420px; }
  .name { margin: 0; font-family: var(--font-sans); font-weight: 800; font-size: 60px; line-height: 0.95; letter-spacing: -0.035em; color: var(--ink); }
  .tag { margin: 16px 0 0; font-family: var(--font-sans); font-weight: 600; font-size: 13px; line-height: 1.4; color: var(--muted); }
</style>
</head>
<body>
<div class="cover">
  <svg viewBox="0 0 960 300" aria-hidden="true">
    <!--
      blocks: chip slab 216x348 (space-8 multiples, radius-card) bleeding off top and bottom; lime 248x124 bleeding right; lavender 104x160 bleeding bottom; violet disc r64; lilac only as pills.
      arrangement: one tall green slab as the anchor, lime and lavender stacked beside it, the violet disc overlapping both like a small accent on top.
      pattern: pills in the slab, from the soft pill-and-card radii in the README (every button and tag is a pill); lime, lilac and lavender pills cycle down the slab.
      scales: x starts at 496 (past the 480 name zone), pill height 28 / gap 18, radius-card 24, pill radius 14.
    -->
    <rect class="c-chip r-card" x="496" y="-24" width="216" height="348"/>
    <rect class="c-lime" x="528" y="32" width="152" height="28" rx="14"/>
    <rect class="c-lil" x="528" y="78" width="96" height="28" rx="14"/>
    <rect class="c-lav" x="528" y="124" width="152" height="28" rx="14"/>
    <rect class="c-lime" x="528" y="170" width="120" height="28" rx="14"/>
    <rect class="c-lil" x="528" y="216" width="152" height="28" rx="14"/>
    <rect class="c-lav" x="528" y="262" width="72" height="28" rx="14"/>
    <rect class="c-lime r-card" x="728" y="24" width="248" height="124"/>
    <rect class="c-lav r-card" x="728" y="164" width="104" height="160"/>
    <circle class="c-vio" cx="880" cy="220" r="64"/>
  </svg>
  <div class="text">
    <h1 class="name">Jackie Diaz<br>Portfolio</h1>
    <p class="tag">Warm greys, deep forest and lime for action, with violet for the details.</p>
  </div>
</div>
</body>
</html>
